name: Update Fundamental Data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import historical data
        run: python scripts/import_history.py

      - name: Fetch official fundamental data
        run: python scripts/fetch_fundamentals.py

      - name: Commit updated data
        run: |
          git config user.name "GPRS Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update official fundamental data"
            git push
          fi
